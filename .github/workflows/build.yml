name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build with Buildozer
        uses: Enteee/buildozer-action@v1.2.2
        with:
          command: buildozer android debug
          repository_root: .
